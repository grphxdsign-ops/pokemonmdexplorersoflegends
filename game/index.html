<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokemon Mystery Dungeon: Explorers of Legends</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="game-shell" aria-label="Pokemon Mystery Dungeon: Explorers of Legends">
      <canvas id="game-canvas" width="960" height="640" aria-label="Game view"></canvas>

      <section id="loading-screen" class="screen screen-loading is-active" aria-live="polite">
        <div class="logo-stack" aria-label="Pokemon Mystery Dungeon: Explorers of Legends">
          <svg class="pmd-logo" viewBox="0 0 760 350" role="img" aria-label="Pokemon Mystery Dungeon: Explorers of Legends">
            <defs>
              <linearGradient id="legend-fill-loading" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#fffdf1"></stop>
                <stop offset=".42" stop-color="#fff7ba"></stop>
                <stop offset=".48" stop-color="#2f9d63"></stop>
                <stop offset="1" stop-color="#0f6845"></stop>
              </linearGradient>
            </defs>
            <path class="logo-green-back" d="M165 73 L233 56 L292 77 L351 42 L389 82 L495 71 L548 94 L611 91 L594 148 L631 183 L552 192 L512 225 L431 201 L365 225 L310 190 L219 211 L229 160 L155 151 Z"></path>
            <text class="logo-layer logo-white-stroke" x="379" y="124" textLength="490">POKEMON</text>
            <text class="logo-layer logo-blue-stroke" x="379" y="124" textLength="490">POKEMON</text>
            <text class="logo-layer logo-poke-fill" x="379" y="124" textLength="490">POKEMON</text>
            <path class="logo-zigzag" d="M60 151 L149 131 L155 114 L206 149 L285 137 L354 153 L432 139 L503 154 L590 142 L610 160 L710 154 L682 210 L593 211 L580 226 L496 208 L425 222 L350 206 L265 220 L192 205 L118 218 L125 190 L44 197 Z"></path>
            <text class="logo-layer mystery-white" x="382" y="211" textLength="670">Mystery Dungeon</text>
            <text class="logo-layer mystery-green" x="382" y="211" textLength="670">Mystery Dungeon</text>
            <text class="logo-layer mystery-black" x="382" y="211" textLength="670">Mystery Dungeon</text>
            <text class="logo-layer mystery-fill" x="382" y="211" textLength="670">Mystery Dungeon</text>
            <text class="logo-layer legends-shadow" x="380" y="299" textLength="690">EXPLORERS OF LEGENDS</text>
            <text class="logo-layer legends-white" x="380" y="292" textLength="690">EXPLORERS OF LEGENDS</text>
            <text class="logo-layer legends-green" x="380" y="292" textLength="690">EXPLORERS OF LEGENDS</text>
            <text class="logo-layer legends-fill" x="380" y="292" textLength="690" fill="url(#legend-fill-loading)">EXPLORERS OF LEGENDS</text>
          </svg>
        </div>
        <div class="loading-strip">
          <span id="loading-copy">Loading a new legend...</span>
          <div class="loading-bar"><span id="loading-fill"></span></div>
        </div>
      </section>

      <section id="title-brand" class="title-brand" aria-hidden="true">
        <div class="logo-stack">
          <svg class="pmd-logo" viewBox="0 0 760 350" role="img" aria-label="Pokemon Mystery Dungeon: Explorers of Legends">
            <defs>
              <linearGradient id="legend-fill-title" x1="0" x2="0" y1="0" y2="1">
                <stop offset="0" stop-color="#fffdf1"></stop>
                <stop offset=".42" stop-color="#fff7ba"></stop>
                <stop offset=".48" stop-color="#2f9d63"></stop>
                <stop offset="1" stop-color="#0f6845"></stop>
              </linearGradient>
            </defs>
            <path class="logo-green-back" d="M165 73 L233 56 L292 77 L351 42 L389 82 L495 71 L548 94 L611 91 L594 148 L631 183 L552 192 L512 225 L431 201 L365 225 L310 190 L219 211 L229 160 L155 151 Z"></path>
            <text class="logo-layer logo-white-stroke" x="379" y="124" textLength="490">POKEMON</text>
            <text class="logo-layer logo-blue-stroke" x="379" y="124" textLength="490">POKEMON</text>
            <text class="logo-layer logo-poke-fill" x="379" y="124" textLength="490">POKEMON</text>
            <path class="logo-zigzag" d="M60 151 L149 131 L155 114 L206 149 L285 137 L354 153 L432 139 L503 154 L590 142 L610 160 L710 154 L682 210 L593 211 L580 226 L496 208 L425 222 L350 206 L265 220 L192 205 L118 218 L125 190 L44 197 Z"></path>
            <text class="logo-layer mystery-white" x="382" y="211" textLength="670">Mystery Dungeon</text>
            <text class="logo-layer mystery-green" x="382" y="211" textLength="670">Mystery Dungeon</text>
            <text class="logo-layer mystery-black" x="382" y="211" textLength="670">Mystery Dungeon</text>
            <text class="logo-layer mystery-fill" x="382" y="211" textLength="670">Mystery Dungeon</text>
            <text class="logo-layer legends-shadow" x="380" y="299" textLength="690">EXPLORERS OF LEGENDS</text>
            <text class="logo-layer legends-white" x="380" y="292" textLength="690">EXPLORERS OF LEGENDS</text>
            <text class="logo-layer legends-green" x="380" y="292" textLength="690">EXPLORERS OF LEGENDS</text>
            <text class="logo-layer legends-fill" x="380" y="292" textLength="690" fill="url(#legend-fill-title)">EXPLORERS OF LEGENDS</text>
          </svg>
        </div>
      </section>

      <section id="menu-panel" class="panel" aria-live="polite"></section>
      <section id="dialogue-panel" class="dialogue" aria-live="polite"></section>
      <section id="hud-panel" class="hud" aria-live="polite"></section>
    </main>

    <script src="src/data.js"></script>
    <script src="src/game.js"></script>
  </body>
</html>
